  .card-hint  { font-size: 0.75rem; color: #888780; margin-bottom: 1rem; }

69, 26.5013, 32.6341, 24.1984], "std": [5.2537, 8.5566, 0.4808, 6.1132, 5.8468], "borderColor": "#378ADD", "backgroundColor": "#378ADD33", "borderDash": [], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tft", "data": [30.3525, 41.8134, 15.3402, 26.5419, 25.1016], "std": [2.4814, 0.6993, 0.9761, 0.3714, 3.0689], "borderColor": "#1D9E75", "backgroundColor": "#1D9E7533", "borderDash": [6, 3], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tsmixer", "data": [4.815, 3.9857, 2.5854, 2.505, 11.3796], "std": [0.0156, 0.0087, 0.0104, 0.0141, 0.0475], "borderColor": "#D85A30", "backgroundColor": "#D85A3033", "borderDash": [2, 2], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "nbeats", "data": [10.272, 13.4045, 10.6675, 11.279, 16.3478], "std": [3.4499, 3.8424, 1.8344, 1.2818, 0.8392], "borderColor": "#7F77DD", "backgroundColor": "#7F77DD33", "borderDash": [8, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "dlinear", "data": [4.7067, 4.5325, 2.8642, 2.5465, 11.0104], "std": [0.0309, 0.1843, 0.0493, 0.2029, 0.0902], "borderColor": "#888780", "backgroundColor": "#88878033", "borderDash": [4, 4, 2, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}]}, {"id": "MDA_pct", "label": "MDA (%)", "direction": "higher", "logScale": false, "datasets": [{"label": "deepAR", "data": [47.5867, 47.42, 47.6633, 46.93, 50.94], "std": [0.6192, 4.0608, 0.8861, 2.7381, 3.1674], "borderColor": "#378ADD", "backgroundColor": "#378ADD33", "borderDash": [], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tft", "data": [51.76, 51.76, 48.32, 51.1067, 51.9233], "std": [2.3618, 2.4716, 3.3516, 1.2759, 3.8613], "borderColor": "#1D9E75", "backgroundColor": "#1D9E7533", "borderDash": [6, 3], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tsmixer", "data": [52.4967, 48.16, 47.42, 51.8467, 46.7667], "std": [0.1443, 0.0, 0.652, 2.1416, 2.4591], "borderColor": "#D85A30", "backgroundColor": "#D85A3033", "borderDash": [2, 2], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "nbeats", "data": [50.9433, 51.5967, 50.2867, 47.42, 49.3867], "std": [2.0456, 0.6501, 3.0539, 1.5348, 3.0171], "borderColor": "#7F77DD", "backgroundColor": "#7F77DD33", "borderDash": [8, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "dlinear", "data": [50.04, 51.1067, 48.57, 51.8433, 49.9567], "std": [2.7045, 1.8524, 2.3618, 4.0261, 1.6358], "borderColor": "#888780", "backgroundColor": "#88878033", "borderDash": [4, 4, 2, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}]}];
const MODELS  = ["deepAR", "tft", "tsmixer", "nbeats", "dlinear"];
const COLORS  = {"deepAR": "#378ADD", "tft": "#1D9E75", "tsmixer": "#D85A30", "nbeats": "#7F77DD", "dlinear": "#888780"};

function buildLegend() {
  const el = document.getElementById('legend');
  MODELS.forEach(m => {
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${COLORS[m]}"></i>${m}`;
    el.appendChild(s);
  });
}

function makeErrorBarPlugin() {
  return {
    id: 'errorBars',
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      chart.data.datasets.forEach((ds, di) => {
        if (!ds.std) return;
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((pt, i) => {
          const std = ds.std[i];
          if (std == null || std === 0) return;
          const x  = pt.x;
          const yScale = chart.scales.y;
          const mean = ds.data[i];
          if (mean == null) return;

          let yTop, yBot;
          if (yScale.type === 'logarithmic') {
            const lo = Math.max(mean - std, mean * 0.01);
            yTop = yScale.getPixelForValue(mean + std);
            yBot = yScale.getPixelForValue(lo);
          } else {
            yTop = yScale.getPixelForValue(mean + std);
            yBot = yScale.getPixelForValue(mean - std);
          }

          ctx.save();
          ctx.strokeStyle = ds.borderColor;
          ctx.lineWidth   = 1;
          ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 4, yTop); ctx.lineTo(x + 4, yTop); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 4, yBot); ctx.lineTo(x + 4, yBot); ctx.stroke();
          ctx.restore();
        });
      });
    }
  };
}

function renderCharts() {
  const grid   = document.getElementById('grid');
  const plugin = makeErrorBarPlugin();
  Chart.register(plugin);

  CHARTS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const hint = c.direction === 'lower' ? 'nižšie = lepšie' : 'vyššie = lepšie';
    card.innerHTML = `
      <div class="card-title">${c.label}</div>
      <div class="card-hint">${hint}${c.logScale ? ' · log škála' : ''}</div>
      <div class="chart-wrap"><canvas id="${c.id}" role="img"
        aria-label="Line chart of ${c.label} per experiment group"></canvas></div>`;
    grid.appendChild(card);

    new Chart(document.getElementById(c.id), {
      type: 'line',
      data: { labels: LABELS, datasets: c.datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const std = ctx.dataset.std?.[ctx.dataIndex];
                const v   = ctx.parsed.y;
                const fmt = n => n >= 1000
                  ? n.toLocaleString('sk', {maximumFractionDigits: 0})
                  : n.toLocaleString('sk', {maximumFractionDigits: 2});
                return `${ctx.dataset.label}: ${fmt(v)}${std != null ? ' ± ' + fmt(std) : ''}`;
              }
            }
          }
        },
        scales: {
          y: {
            type: c.logScale ? 'logarithmic' : 'linear',
            ticks: {
              font: { size: 11 },
              callback: v => v >= 10000
                ? (v/1000).toFixed(0)+'k'
                : v >= 1000 ? v.toLocaleString('sk') : +v.toPrecision(4)
            },
            grid: { color: 'rgba(0,0,0,0.05)' }
          },
          x: {
            ticks: { font: { size: 11 }, maxRotation: 30 },
            grid: { display: false }
          }
        }
      }
    });
  });
}

buildLegend();
renderCharts();
</script>
