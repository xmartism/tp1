4.3699, 31.3283, 29.2833], "std": [3.7311, 7.4456, 3.8996, 2.2408, 7.1549], "borderColor": "#378ADD", "backgroundColor": "#378ADD33", "borderDash": [], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tft", "data": [36.9677, 41.2982, 13.9804, 28.5145, 28.428], "std": [5.0756, 0.5549, 0.2315, 1.9052, 2.0147], "borderColor": "#1D9E75", "backgroundColor": "#1D9E7533", "borderDash": [6, 3], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tsmixer", "data": [5.8424, 6.0738, 4.2743, 4.0601, 16.8245], "std": [0.0367, 0.0046, 0.0252, 0.0126, 0.1585], "borderColor": "#D85A30", "backgroundColor": "#D85A3033", "borderDash": [2, 2], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "nbeats", "data": [22.679, 17.0275, 7.4211, 16.9863, 23.6231], "std": [2.9341, 1.5261, 1.4797, 1.4622, 0.6145], "borderColor": "#7F77DD", "backgroundColor": "#7F77DD33", "borderDash": [8, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "dlinear", "data": [5.7509, 6.7048, 4.4601, 4.1224, 18.9061], "std": [0.0676, 0.1041, 0.0974, 0.1443, 0.4058], "borderColor": "#888780", "backgroundColor": "#88878033", "borderDash": [4, 4, 2, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}]}, {"id": "MDA_pct", "label": "MDA (%)", "direction": "higher", "logScale": false, "datasets": [{"label": "deepAR", "data": [45.6933, 50.3933, 48.13, 51.0867, 50.5667], "std": [1.305, 1.3815, 2.129, 2.8754, 3.2201], "borderColor": "#378ADD", "backgroundColor": "#378ADD33", "borderDash": [], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tft", "data": [50.4767, 49.1733, 49.61, 50.74, 51.35], "std": [1.6809, 1.3139, 0.6879, 1.8924, 2.7461], "borderColor": "#1D9E75", "backgroundColor": "#1D9E7533", "borderDash": [6, 3], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tsmixer", "data": [53.0, 50.0433, 49.1733, 52.5667, 49.0], "std": [2.6486, 3.9202, 1.593, 2.8739, 1.3397], "borderColor": "#D85A30", "backgroundColor": "#D85A3033", "borderDash": [2, 2], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "nbeats", "data": [47.2567, 48.5633, 52.3933, 51.5233, 50.48], "std": [3.395, 3.4114, 3.2815, 2.2226, 3.6583], "borderColor": "#7F77DD", "backgroundColor": "#7F77DD33", "borderDash": [8, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "dlinear", "data": [50.13, 49.1733, 47.4333, 49.7833, 49.52], "std": [3.4565, 2.6837, 2.0954, 3.8058, 1.4825], "borderColor": "#888780", "backgroundColor": "#88878033", "borderDash": [4, 4, 2, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}]}];
const MODELS  = ["deepAR", "tft", "tsmixer", "nbeats", "dlinear"];
const COLORS  = {"deepAR": "#378ADD", "tft": "#1D9E75", "tsmixer": "#D85A30", "nbeats": "#7F77DD", "dlinear": "#888780"};

function buildLegend() {
  const el = document.getElementById('legend');
  MODELS.forEach(m => {
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${COLORS[m]}"></i>${m}`;
    el.appendChild(s);
  });
}

function makeErrorBarPlugin() {
  return {
    id: 'errorBars',
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      chart.data.datasets.forEach((ds, di) => {
        if (!ds.std) return;
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((pt, i) => {
          const std = ds.std[i];
          if (std == null || std === 0) return;
          const x  = pt.x;
          const yScale = chart.scales.y;
          const mean = ds.data[i];
          if (mean == null) return;

          let yTop, yBot;
          if (yScale.type === 'logarithmic') {
            const lo = Math.max(mean - std, mean * 0.01);
            yTop = yScale.getPixelForValue(mean + std);
            yBot = yScale.getPixelForValue(lo);
          } else {
            yTop = yScale.getPixelForValue(mean + std);
            yBot = yScale.getPixelForValue(mean - std);
          }

          ctx.save();
          ctx.strokeStyle = ds.borderColor;
          ctx.lineWidth   = 1;
          ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 4, yTop); ctx.lineTo(x + 4, yTop); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 4, yBot); ctx.lineTo(x + 4, yBot); ctx.stroke();
          ctx.restore();
        });
      });
    }
  };
}

function renderCharts() {
  const grid   = document.getElementById('grid');
  const plugin = makeErrorBarPlugin();
  Chart.register(plugin);

  CHARTS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const hint = c.direction === 'lower' ? 'nižšie = lepšie' : 'vyššie = lepšie';
    card.innerHTML = `
      <div class="card-title">${c.label}</div>
      <div class="card-hint">${hint}${c.logScale ? ' · log škála' : ''}</div>
      <div class="chart-wrap"><canvas id="${c.id}" role="img"
        aria-label="Line chart of ${c.label} per experiment group"></canvas></div>`;
    grid.appendChild(card);

    new Chart(document.getElementById(c.id), {
      type: 'line',
      data: { labels: LABELS, datasets: c.datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const std = ctx.dataset.std?.[ctx.dataIndex];
                const v   = ctx.parsed.y;
                const fmt = n => n >= 1000
                  ? n.toLocaleString('sk', {maximumFractionDigits: 0})
                  : n.toLocaleString('sk', {maximumFractionDigits: 2});
                return `${ctx.dataset.label}: ${fmt(v)}${std != null ? ' ± ' + fmt(std) : ''}`;
              }
            }
          }
        },
        scales: {
          y: {
            type: c.logScale ? 'logarithmic' : 'linear',
            ticks: {
              font: { size: 11 },
              callback: v => v >= 10000
                ? (v/1000).toFixed(0)+'k'
                : v >= 1000 ? v.toLocaleString('sk') : +v.toPrecision(4)
            },
            grid: { color: 'rgba(0,0,0,0.05)' }
          },
          x: {
            ticks: { font: { size: 11 }, maxRotation: 30 },
            grid: { display: false }
          }
        }
      }
    });
  });
}

buildLegend();
renderCharts();
