borderDash": [4, 4, 2, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}]}, {"id": "MAPE_pct", "label": "MAPE (%)", "direction": "lower", "logScale": false, "datasets": [{"label": "deepAR", "data": [46213776.6045, 110203060.93, 24.5689, 30.6341, 40738.6565, 29122.5634], "std": [22117399.0166, 126507664.3446, 2.1328, 19.0439, 10704.6463, 3300.2174], "borderColor": "#378ADD", "backgroundColor": "#378ADD33", "borderDash": [], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tft", "data": [133442136.2875, 162784285.8401, 12.9172, 19.9938, 18884.4568, 19890.8702], "std": [11392571.0018, 15046650.9873, 0.3244, 3.3834, 2986.2268, 3246.6003], "borderColor": "#1D9E75", "backgroundColor": "#1D9E7533", "borderDash": [6, 3], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "tsmixer", "data": [49687226.1064, 118799152.7731, 9.3453, 12.8856, 16862.6452, 15854.3393], "std": [8787599.2333, 2401003.8765, 0.0882, 0.0846, 5516.6662, 5145.6751], "borderColor": "#D85A30", "backgroundColor": "#D85A3033", "borderDash": [2, 2], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "nbeats", "data": [101710503.7566, 154449371.2012, 12.7119, 17.5677, null, null], "std": [18868550.6227, 11476357.0899, 0.5896, 1.565, null, null], "borderColor": "#7F77DD", "backgroundColor": "#7F77DD33", "borderDash": [8, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}, {"label": "dlinear", "data": [91072994.244, 175347205.7903, 14.5697, 18.1517, 2899.7823, 2926.4577], "std": [6043162.675, 2708930.0451, 0.019, 0.0195, 1416.9994, 370.751], "borderColor": "#888780", "backgroundColor": "#88878033", "borderDash": [4, 4, 2, 4], "borderWidth": 2, "pointRadius": 4, "tension": 0.3, "fill": false}]}, {"id": "MDA_pct", "label": "MDA (%)", "direction": "higher", "logScale": false, "datasets": [{"label": "deepAR", "data": [42.3133, 43.3, 38.0567, 41.2633, 85.6733, 85.5067], "std": [1.1075, 0.5243, const MODELS  = ["deepAR", "tft", "tsmixer", "nbeats", "dlinear"];
const COLORS  = {"deepAR": "#378ADD", "tft": "#1D9E75", "tsmixer": "#D85A30", "nbeats": "#7F77DD", "dlinear": "#888780"};

function buildLegend() {
  const el = document.getElementById('legend');
  MODELS.forEach(m => {
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${COLORS[m]}"></i>${m}`;
    el.appendChild(s);
  });
}

function makeErrorBarPlugin() {
  return {
    id: 'errorBars',
    afterDatasetsDraw(chart) {
      const ctx = chart.ctx;
      chart.data.datasets.forEach((ds, di) => {
        if (!ds.std) return;
        const meta = chart.getDatasetMeta(di);
        meta.data.forEach((pt, i) => {
          const std = ds.std[i];
          if (std == null || std === 0) return;
          const x  = pt.x;
          const yScale = chart.scales.y;
          const mean = ds.data[i];
          if (mean == null) return;

          let yTop, yBot;
          if (yScale.type === 'logarithmic') {
            const lo = Math.max(mean - std, mean * 0.01);
            yTop = yScale.getPixelForValue(mean + std);
            yBot = yScale.getPixelForValue(lo);
          } else {
            yTop = yScale.getPixelForValue(mean + std);
            yBot = yScale.getPixelForValue(mean - std);
          }

          ctx.save();
          ctx.strokeStyle = ds.borderColor;
          ctx.lineWidth   = 1;
          ctx.globalAlpha = 0.55;
          ctx.beginPath(); ctx.moveTo(x, yTop); ctx.lineTo(x, yBot); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 4, yTop); ctx.lineTo(x + 4, yTop); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x - 4, yBot); ctx.lineTo(x + 4, yBot); ctx.stroke();
          ctx.restore();
        });
      });
    }
  };
}

function renderCharts() {
  const grid   = document.getElementById('grid');
  const plugin = makeErrorBarPlugin();
  Chart.register(plugin);

  CHARTS.forEach(c => {
    const card = document.createElement('div');
    card.className = 'card';
    const hint = c.direction === 'lower' ? 'nižšie = lepšie' : 'vyššie = lepšie';
    card.innerHTML = `
      <div class="card-title">${c.label}</div>
      <div class="card-hint">${hint}${c.logScale ? ' · log škála' : ''}</div>
      <div class="chart-wrap"><canvas id="${c.id}" role="img"
        aria-label="Line chart of ${c.label} per experiment group"></canvas></div>`;
    grid.appendChild(card);

    new Chart(document.getElementById(c.id), {
      type: 'line',
      data: { labels: LABELS, datasets: c.datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => {
                const std = ctx.dataset.std?.[ctx.dataIndex];
                const v   = ctx.parsed.y;
                const fmt = n => n >= 1000
                  ? n.toLocaleString('sk', {maximumFractionDigits: 0})
                  : n.toLocaleString('sk', {maximumFractionDigits: 2});
                return `${ctx.dataset.label}: ${fmt(v)}${std != null ? ' ± ' + fmt(std) : ''}`;
              }
            }
          }
        },
        scales: {
          y: {
            type: c.logScale ? 'logarithmic' : 'linear',
            ticks: {
              font: { size: 11 },
              callback: v => v >= 10000
                ? (v/1000).toFixed(0)+'k'
                : v >= 1000 ? v.toLocaleString('sk') : +v.toPrecision(4)
            },
            grid: { color: 'rgba(0,0,0,0.05)' }
          },
          x: {
            ticks: { font: { size: 11 }, maxRotation: 30 },
            grid: { display: false }
          }
        }
      }
    });
  });
}

buildLegend();
renderCharts();
</script>
